server:
  port: 8082

spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/basket
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

kafka:
  url: localhost:9092
  topic: order-events
  group: notification-group

notification:
  mail:
    to: seu-email@exemplo.com