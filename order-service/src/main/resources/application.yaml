server:
  port: 8081

spring:
  application:
    name: order-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: orders

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/basket

kafka:
  url: localhost:9092
  topic: order-events